<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- The Orbit mark (components/brand/orbit-mark.tsx) on the app icons' near-black tile.
       Strokes are heavier than in the app so the rings still read at 16px in a tab. -->
  <rect width="100" height="100" rx="22" fill="#050505"/>
  <g transform="translate(50 50) scale(0.74) translate(-50 -50)">
    <g stroke="#EDEDED" stroke-width="6" stroke-linecap="round">
      <circle cx="50" cy="50" r="33"/>
      <circle cx="50" cy="50" r="21"/>
      <ellipse cx="50" cy="49" rx="47" ry="12.5" transform="rotate(-41 50 49)"/>
    </g>
    <circle cx="74.5" cy="25.5" r="7" fill="#F5A623"/>
  </g>
</svg>
